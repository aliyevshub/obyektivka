name: Test va joylash

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    # Asosiy (default) branchga push bo'lganda yoki qo'lda ishga tushirilganda Cloudflare'ga joylaydi
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CARD_NUMBER: ${{ secrets.CARD_NUMBER }}
      CARD_OWNER: ${{ secrets.CARD_OWNER }}
    steps:
      - name: Kalitlar borligini tekshirish
        run: |
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BOT_TOKEN; do
            if [ -z "${!v}" ]; then echo "::error::GitHub Secrets'da $v yo'q (README ga qarang)"; exit 1; fi
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: D1 bazasini tayyorlash
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="obyektivka") | .uuid')
          if [ -z "$id" ]; then
            npx wrangler d1 create obyektivka
            id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="obyektivka") | .uuid')
          fi
          sed -i "s/00000000-0000-0000-0000-000000000000/$id/" wrangler.toml
          npx wrangler d1 migrations apply obyektivka --remote

      - name: Workerni joylash
        run: npx wrangler deploy | tee deploy.log

      - name: Bot tokenini saqlash
        run: printf '%s' "$BOT_TOKEN" | npx wrangler secret put BOT_TOKEN

      - name: To'lov kartasini saqlash
        run: |
          if [ -n "$CARD_NUMBER" ]; then printf '%s' "$CARD_NUMBER" | npx wrangler secret put CARD_NUMBER; else echo "::warning::CARD_NUMBER secret yo'q — botda karta raqami ko'rsatilmaydi"; fi
          if [ -n "$CARD_OWNER" ]; then printf '%s' "$CARD_OWNER" | npx wrangler secret put CARD_OWNER; fi

      - name: Telegram webhook'ini ulash
        run: |
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "Worker manzili: $url"
          sleep 5
          curl -fsS "$url/setup"

name = "obyektivka-bot"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Shriftlar Worker ichiga ikkilik ma'lumot sifatida joylanadi
rules = [{ type = "Data", globs = ["**/*.ttf", "**/*.jpg"], fallthrough = true }]

# Administrator (cheklarni tasdiqlaydi, /kod buyrug'i)
[vars]
ADMIN_ID = "1295718505"

# To'lov cheklarini tekshirish uchun sun'iy intellekt
[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "obyektivka"
# GitHub Actions deploy paytida bu qiymatni o'zi to'ldiradi (README ga qarang)
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Har kuni 7 kundan eski ma'lumotlarni o'chirish
[triggers]
crons = ["17 3 * * *"]

[observability]
enabled = true
